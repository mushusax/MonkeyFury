ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.mushusax.PluginsKt.configurePlugins
      - com.mushusax.ExposedKt.configureExposed
      - com.mushusax.AuthKt.configureAuth
      - com.mushusax.RoutingKt.configureRouting
      - com.mushusax.ActivitiesKt.configureActivities

database:
  # foreign_keys=on: SQLite only enforces foreign keys when asked to
  url: "jdbc:sqlite:app.db?foreign_keys=on"

auth:
  google:
    webClientId: "399364014623-3uqeqnouqg5f2iq4l4aucee02aksf7tm.apps.googleusercontent.com"
  jwt:
    issuer: "https://munkyfury.app"
    audience: "munkyfury-app"
    validityDays: 7
